*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:24px 28px;background:linear-gradient(135deg,#1f3f2d,#446b50);color:white}
header h1{margin:0 0 6px;font-family:Georgia,serif;font-size:30px}
header p{margin:0;opacity:.86}
.app{display:grid;grid-template-columns:360px 1fr;height:calc(100vh - 105px);min-height:620px}
.sidebar{background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:18px}
.mapwrap{position:relative;min-height:500px}
#map{height:100%;width:100%}
.controls{display:grid;gap:10px;margin-bottom:15px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 16px}
.stat{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfaf5}
.stat b{display:block;font-size:20px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
.card{padding:13px;margin:9px 0;border:1px solid var(--line);border-radius:12px;background:white;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-1px);box-shadow:0 4px 14px #244b3514}
.card h3{margin:0 0 4px;font-size:16px}
.local{color:var(--green2);font-weight:650;font-size:13px}
.sci{font-family:Georgia,serif;font-style:italic;font-size:12px;color:var(--muted);margin-top:4px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11px;padding:4px 7px;border-radius:999px;background:#edf3ed;color:var(--green)}
.notice{font-size:12px;line-height:1.5;padding:11px;border-left:4px solid var(--accent);background:#fff8eb;margin:10px 0 14px}
.legend{position:absolute;z-index:1000;right:14px;bottom:14px;background:white;padding:10px 12px;border-radius:10px;box-shadow:0 2px 12px #0002;font-size:12px}
.leaflet-popup-content-wrapper{border-radius:12px}
.popup h3{margin:0 0 5px;color:var(--green)}
.popup .latin{font-family:Georgia,serif;font-style:italic;color:#68736b}
@media(max-width:900px){.app{grid-template-columns:1fr;height:auto}.sidebar{max-height:58vh;border-right:0;border-bottom:1px solid var(--line)}.mapwrap{height:60vh}}

function smoothCoords(coords, tension=0.18, steps=10){
  // Nội suy Catmull-Rom để đường khoanh thành một dải cong mềm,
  // không còn các cạnh thẳng kiểu đa giác.
  const out=[];
  const n=coords.length;
  for(let i=0;i<n;i++){
    const p0=coords[(i-1+n)%n], p1=coords[i], p2=coords[(i+1)%n], p3=coords[(i+2)%n];
    for(let j=0;j<steps;j++){
      const t=j/steps, t2=t*t, t3=t2*t;
      const lat=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const lng=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      out.push([lat,lng]);
    }
  }
  return out;
}

const areaLayers=[];

  const layer=L.polygon(smoothCoords(a.coords), {...areaStyle, smoothFactor:1.2});
  layer.bindTooltip(a.short,{sticky:true});
  layer.bindPopup(`<div class="popup"><h3>${a.name}</h3>
      <div class="latin">${a.kind}</div>
      <p>${a.desc}</p>
    </div>`);
  layer.addTo(map);
  areaLayers.push(layer);
});

function popup(x){
 return `<div class="popup">
 <h3>${x.name}</h3><div class="local">${x.local}</div>
 <div class="latin">${x.scientific}</div>
 <p><b>Họ:</b> ${x.family}<br><b>Bộ phận sử dụng:</b> ${x.part}</p>
 <p><b>Sinh cảnh theo tri thức bản địa:</b><br>${x.habitat}</p>
 </div>`;
}

function render(){
 const q=document.getElementById('search').value.toLowerCase().trim();
 const fam=familySelect.value, part=partSelect.value;
 const filtered=species.filter(x =>
   (!q || [x.name,x.local,x.scientific,x.family,x.habitat].join(' ').toLowerCase().includes(q)) &&
   (!fam || x.family===fam) && (!part || x.part===part)
 );
 document.getElementById('count').textContent=filtered.length;
 document.getElementById('list').innerHTML=filtered.map(x=>`
   <article class="card" onclick="showSpecies(${x.id})">
     <h3>${String(x.id).padStart(2,'0')} · ${x.name}</h3>
     <div class="local">${x.local}</div>
     <div class="sci">${x.scientific}</div>
     <div class="meta"><span class="tag">${x.family}</span><span class="tag">${x.part}</span></div>
   </article>`).join('') || '<p style="color:#6c756e">Không tìm thấy loài phù hợp.</p>';
}

function showSpecies(id){
 const x=species.find(s=>s.id===id);
 // Không tạo điểm phân bố giả. Hiển thị hồ sơ loài và đưa bản đồ về toàn bộ
 // các khu vực thực địa đã khoanh.
 map.fitBounds(allBounds.pad(0.10));
 L.popup()
   .setLatLng([12.08,108.50])
   .setContent(popup(x))
   .openOn(map);
}
document.getElementById('search').addEventListener('input',render);
familySelect.addEventListener('change',render);
partSelect.addEventListener('change',render);
render();
